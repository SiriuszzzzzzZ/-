<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>班级星空 · 同窗小栈 — 高保真原型 V2 (微交互打磨)</title>
<style>
  :root {
    --cream: #FFFBF5;
    --coral-50: #FFF5F5; --coral-100: #FFE8E5; --coral-200: #FFCEC7;
    --coral-300: #FFA99E; --coral-400: #FF7A6B; --coral-500: #FF5C4A;
    --mint-50: #F2FDF9; --mint-100: #DFF8EF; --mint-200: #B5F0DB;
    --mint-400: #4ECDC4; --mint-500: #35B5A8;
    --peach-50: #FFF9F2; --peach-100: #FFEFDE; --peach-400: #FFB355; --peach-500: #F59E2E;
    --warm-50: #FDFBF7; --warm-100: #F7F1E8; --warm-200: #EDE0CE;
    --warm-300: #D4C4A8; --warm-400: #B8A58A; --warm-500: #8C7B6E;
    --warm-600: #6B5D52; --warm-700: #4A3F38; --warm-800: #2D2520; --warm-900: #1A1512;

    /* ── Easing curves (from interaction-design skill) ── */
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in: cubic-bezier(0.55, 0, 1, 0.45);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --spring-soft: cubic-bezier(0.34, 1.3, 0.64, 1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background: var(--cream);
    color: var(--warm-700);
    -webkit-font-smoothing: antialiased;
    display:flex; justify-content:center;
  }
  #root { width:100%; max-width:430px; min-height:100vh; position:relative; overflow-x:hidden; }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:#E8D5C8; border-radius:2px; }

  /* ── Respect reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ═══════════════ KEYFRAMES ═══════════════ */

  /* Entry: slide up with fade */
  @keyframes floatUp {
    0%   { opacity:0; transform:translateY(16px) scale(0.96); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  /* Entry: pop with spring overshoot */
  @keyframes popSpring {
    0%   { opacity:0; transform:scale(0.8); }
    60%  { opacity:1; transform:scale(1.06); }
    100% { transform:scale(1); }
  }
  /* Entry: gentle fade in */
  @keyframes fadeIn {
    0%   { opacity:0; }
    100% { opacity:1; }
  }
  /* Exit: shrink + fade */
  @keyframes shrinkOut {
    0%   { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(0.9); }
  }
  /* Star pulse for help submitted */
  @keyframes starGlow {
    0%,100% { filter:drop-shadow(0 0 0px transparent); transform:scale(1); }
    30%     { filter:drop-shadow(0 0 6px rgba(255,92,74,0.8)); transform:scale(1.3); }
    60%     { filter:drop-shadow(0 0 12px rgba(255,92,74,0.4)); transform:scale(1.1); }
  }
  /* Ripple for click feedback */
  @keyframes rippleOut {
    0%   { transform:scale(0); opacity:0.6; }
    100% { transform:scale(4); opacity:0; }
  }
  /* Particle float in */
  @keyframes particleFloat {
    0%   { opacity:0; transform:translateY(8px) translateX(-4px); }
    100% { opacity:1; transform:translateY(0) translateX(0); }
  }
  /* Particle fade out (24h expiry) */
  @keyframes particleFade {
    0%   { opacity:1; transform:scale(1); }
    70%  { opacity:0.5; transform:scale(0.97); }
    100% { opacity:0; transform:scale(0.9); }
  }
  /* Sky breathing when no mood */
  @keyframes skyBreathe {
    0%,100% { opacity:0.6; }
    50%     { opacity:0.8; }
  }
  /* Confetti for help sent */
  @keyframes confettiDrop {
    0%   { opacity:1; transform:translateY(-40px) rotate(0deg); }
    100% { opacity:0; transform:translateY(60px) rotate(180deg); }
  }
  /* Shake for error */
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    20%     { transform:translateX(-4px); }
    40%     { transform:translateX(4px); }
    60%     { transform:translateX(-3px); }
    80%     { transform:translateX(2px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ══════════════════════════════════════════
   Utility Hooks
   ══════════════════════════════════════════ */
function useAnimationSequence(steps, deps) {
  const [current, setCurrent] = useState(-1);
  const timersRef = useRef([]);

  useEffect(() => {
    timersRef.current.forEach(clearTimeout);
    timersRef.current = [];
    setCurrent(-1);

    if (!steps.length) return;

    steps.forEach((delay, i) => {
      const t = setTimeout(() => setCurrent(i), delay);
      timersRef.current.push(t);
    });

    return () => timersRef.current.forEach(clearTimeout);
  }, deps || []);

  return current;
}

/* ══════════════════════════════════════════
   Ripple — click feedback
   ══════════════════════════════════════════ */
function Ripple({ x, y, color }) {
  return (
    <span style={{
      position:'absolute', left:x-6, top:y-6,
      width:12, height:12,
      borderRadius:'50%',
      background:color || 'rgba(255,255,255,0.5)',
      animation:'rippleOut 0.5s var(--ease-out) forwards',
      pointerEvents:'none',
    }} />
  );
}

/* ══════════════════════════════════════════
   ConfirmPanel — replaces window.confirm()
   ══════════════════════════════════════════ */
function ConfirmPanel({ message, onConfirm, onCancel }) {
  return (
    <div style={{
      position:'fixed', inset:0, zIndex:100,
      background:'rgba(26,21,18,0.3)', backdropFilter:'blur(2px)',
      display:'flex', alignItems:'center', justifyContent:'center',
      animation:'fadeIn 0.2s var(--ease-out)',
    }} onClick={onCancel}>
      <div style={{
        background:'#fff', borderRadius:20, padding:'24px 28px 20px',
        maxWidth:280, width:'85%',
        boxShadow:'0 16px 48px rgba(26,21,18,0.15)',
        animation:'popSpring 0.35s var(--spring) both',
        textAlign:'center',
      }} onClick={e => e.stopPropagation()}>
        <p style={{ fontSize:15, color:'var(--warm-700)', lineHeight:1.6, marginBottom:20 }}>
          {message}
        </p>
        <div style={{ display:'flex', gap:10 }}>
          <button onClick={onCancel} style={{
            flex:1, padding:'10px 0', borderRadius:14,
            border:'1px solid var(--warm-200)', background:'#fff',
            color:'var(--warm-500)', fontSize:14, cursor:'pointer',
            transition:'background 0.15s',
          }}>取消</button>
          <button onClick={onConfirm} style={{
            flex:1, padding:'10px 0', borderRadius:14,
            border:'none', background:'var(--coral-400)', color:'#fff',
            fontSize:14, fontWeight:500, cursor:'pointer',
            transition:'background 0.15s, transform 0.1s',
          }}
            onMouseDown={e => e.currentTarget.style.transform='scale(0.96)'}
            onMouseUp={e => e.currentTarget.style.transform='scale(1)'}
          >确定</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   Toast — ritual feedback (not browser alert)
   ══════════════════════════════════════════ */
function Toast({ icon, message, sub, duration = 2800, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, duration);
    return () => clearTimeout(t);
  }, [duration, onDone]);

  return (
    <div style={{
      position:'fixed', top:'30%', left:'50%', transform:'translateX(-50%)', zIndex:90,
      background:'rgba(255,255,255,0.95)', backdropFilter:'blur(10px)',
      borderRadius:20, padding:'24px 32px',
      boxShadow:'0 8px 40px rgba(26,21,18,0.12)',
      textAlign:'center',
      animation:'popSpring 0.45s var(--spring) both',
    }}>
      <p style={{ fontSize:40, marginBottom:8, animation:'starGlow 1.5s var(--ease-in-out) infinite' }}>
        {icon}
      </p>
      <p style={{ fontSize:15, color:'var(--warm-700)', fontWeight:500 }}>{message}</p>
      {sub && <p style={{ fontSize:12, color:'var(--warm-400)', marginTop:4 }}>{sub}</p>}
    </div>
  );
}

/* ══════════════════════════════════════════
   StarrySky — Canvas with enhanced animation states
   ══════════════════════════════════════════ */
function StarrySky({ mood, starCount = 65, transitionPhase }) {
  const canvasRef = useRef(null);
  const starsRef = useRef([]);
  const animRef = useRef(null);
  const skyColorRef = useRef({ r1:28, g1:40, b1:64, r2:58, g2:64, b2:88 });

  useEffect(() => {
    const stars = [];
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random() * 0.7 + 0.05,
        r: Math.random() * 2 + 0.8,
        baseAlpha: Math.random() * 0.35 + 0.2,
        speed: Math.random() * 0.018 + 0.004,
        phase: Math.random() * Math.PI * 2,
        state: 'dim',
        pulse: 0,
        targetAlpha: 0,
        transitionStart: 0,
      });
    }
    starsRef.current = stars;
  }, [starCount]);

  // When mood changes, animate stars lighting up in sequence
  useEffect(() => {
    if (!mood) {
      starsRef.current.forEach(s => {
        s.state = 'dim';
        s.baseAlpha = 0.15 + Math.random() * 0.2;
        s.targetAlpha = s.baseAlpha;
      });
      return;
    }

    const stars = starsRef.current;
    const countMap = { GROWING:35, SUNNY:25, RAINY:12, STORMY:5 };
    const count = countMap[mood] || 25;

    const indices = stars.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    // Stagger star lighting — each star lights up with delay
    stars.forEach((s, i) => {
      s.transitionStart = performance.now() + i * 40; // 40ms stagger per star
      if (i < count) {
        s.state = 'lighting';
        s.targetAlpha = 0.7 + Math.random() * 0.3;
      } else {
        s.state = 'dimming';
        s.targetAlpha = 0.12 + Math.random() * 0.15;
      }
    });
  }, [mood, starCount]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }
    resize();
    window.addEventListener('resize', resize);

    function draw(t) {
      const stars = starsRef.current;
      const w = canvas.width / dpr;
      const h = canvas.height / dpr;
      ctx.clearRect(0, 0, w, h);

      // Smooth sky color transition
      const target = mood ? {
        STORMY: { r1:45,g1:40,b1:64, r2:74,g2:63,b2:80 },
        RAINY:  { r1:42,g1:53,b1:80, r2:74,g2:85,b2:104 },
        GROWING:{ r1:30,g1:58,b1:74, r2:42,g2:90,b2:80 },
        SUNNY:  { r1:26,g1:48,b1:80, r2:58,g2:80,b2:112 },
      }[mood] : { r1:28,g1:40,b1:64, r2:58,g2:64,b2:88 };

      if (!target) return;

      const sc = skyColorRef.current;
      const ease = 0.03; // slow transition
      sc.r1 += (target.r1 - sc.r1) * ease;
      sc.g1 += (target.g1 - sc.g1) * ease;
      sc.b1 += (target.b1 - sc.b1) * ease;
      sc.r2 += (target.r2 - sc.r2) * ease;
      sc.g2 += (target.g2 - sc.g2) * ease;
      sc.b2 += (target.b2 - sc.b2) * ease;

      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, `rgb(${Math.round(sc.r1)},${Math.round(sc.g1)},${Math.round(sc.b1)})`);
      grad.addColorStop(0.65, `rgb(${Math.round(sc.r2)},${Math.round(sc.g2)},${Math.round(sc.b2)})`);
      grad.addColorStop(1, '#FFFBF5');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Draw stars with transitioning state
      stars.forEach((s) => {
        const x = s.x * w;
        const y = s.y * h;

        // Transition to target alpha
        if (s.state === 'lighting' || s.state === 'dimming') {
          const elapsed = t - s.transitionStart;
          if (elapsed > 0) {
            // Smooth interpolation
            const progress = Math.min(1, elapsed / 600);
            const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
            s.baseAlpha += (s.targetAlpha - s.baseAlpha) * eased * 0.3;
            if (Math.abs(s.baseAlpha - s.targetAlpha) < 0.01) {
              s.baseAlpha = s.targetAlpha;
              s.state = s.state === 'lighting' ? 'lit' : 'dim';
            }
          }
        }

        // Breathing animation
        let alpha = s.baseAlpha;
        if (s.state === 'lit' || s.state === 'dim') {
          alpha += Math.sin(t * s.speed + s.phase) * 0.12;
        }
        if (s.state === 'pulse') {
          alpha += Math.sin(t * 0.008 + s.phase) * 0.25;
        }
        alpha = Math.max(0.03, Math.min(1, alpha));

        // Color
        if (s.state === 'red') {
          ctx.fillStyle = `rgba(255,92,74,${alpha})`;
          ctx.shadowColor = `rgba(255,92,74,${alpha*0.5})`;
        } else if (s.state === 'pulse') {
          ctx.fillStyle = `rgba(255,240,200,${alpha})`;
          ctx.shadowColor = `rgba(255,210,140,${alpha*0.7})`;
        } else if (s.state === 'lit' || s.state === 'lighting') {
          ctx.fillStyle = `rgba(255,235,200,${alpha})`;
          ctx.shadowColor = `rgba(255,215,160,${alpha*0.35})`;
        } else {
          ctx.fillStyle = `rgba(190,205,225,${alpha})`;
          ctx.shadowColor = 'transparent';
        }

        ctx.shadowBlur = s.state === 'pulse' ? 8 : s.state === 'red' ? 5 : 2.5;
        ctx.beginPath();
        ctx.arc(x, y, s.r, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      animRef.current = requestAnimationFrame(draw);
    }

    animRef.current = requestAnimationFrame(draw);
    return () => {
      cancelAnimationFrame(animRef.current);
      window.removeEventListener('resize', resize);
    };
  }, [mood]);

  return (
    <canvas ref={canvasRef} style={{
      position:'absolute', top:0, left:0, width:'100%', height:'100%', pointerEvents:'none',
      opacity: transitionPhase === 'entering' ? 1 : 1,
      transition: 'opacity 0.6s var(--ease-out)',
    }} />
  );
}

/* ══════════════════════════════════════════
   AtmosphereBlobs
   ══════════════════════════════════════════ */
function AtmosphereBlobs({ mood }) {
  const palettes = {
    null:   ['#FFE8E5','#DFF8EF','#FFEFDE'],
    SUNNY:  ['#FFE0CE','#DFF0E0','#FFF0E0'],
    GROWING:['#DFF8EF','#C8F0DF','#FFF5E8'],
    RAINY:  ['#E8E0F0','#D8D8E8','#FFE8E5'],
    STORMY: ['#E0D8E8','#D0C8D0','#FFE0D8'],
  };
  const c = palettes[mood||'null'] || palettes['null'];

  return (
    <div style={{ position:'absolute',inset:0,pointerEvents:'none',overflow:'hidden' }}>
      <div style={{
        position:'absolute', top:'-18%', right:'-12%', width:'55%', height:'32%',
        borderRadius:'50%', background:c[0], opacity:0.45, filter:'blur(45px)',
        transition:'background 1s var(--ease-out)',
      }} />
      <div style={{
        position:'absolute', bottom:'-10%', left:'-8%', width:'42%', height:'26%',
        borderRadius:'50%', background:c[1], opacity:0.35, filter:'blur(38px)',
        transition:'background 1s var(--ease-out)',
      }} />
      <div style={{
        position:'absolute', top:'35%', right:'8%', width:'18%', height:'12%',
        borderRadius:'50%', background:c[2], opacity:0.3, filter:'blur(22px)',
        transition:'background 1s var(--ease-out)',
        animation:'particleFloat 5s var(--ease-in-out) infinite alternate',
      }} />
    </div>
  );
}

/* ══════════════════════════════════════════
   MoodPicker — Full animation sequence
   Phases: idle → hover → click(ripple+expand) → confirm(stars respond)
   ══════════════════════════════════════════ */
const MOODS = [
  { id:'SUNNY', emoji:'🌤', label:'还行', color:'#FFD4B8' },
  { id:'GROWING', emoji:'🌱', label:'状态不错', color:'#C8E8D0' },
  { id:'RAINY', emoji:'🌧', label:'有点累', color:'#D0D4E8' },
  { id:'STORMY', emoji:'🌪', label:'快炸了', color:'#E0C8D0' },
];

function MoodPicker({ onSelect, selected }) {
  const [hovered, setHovered] = useState(null);
  const [clicked, setClicked] = useState(null); // which mood was clicked (mid-animation)
  const [ripples, setRipples] = useState([]);
  const phaseOrder = ['idle','clicked','expanding','confirmed'];

  function handleClick(moodId, e) {
    if (selected || clicked) return;
    const rect = e.currentTarget.getBoundingClientRect();
    setRipples(prev => [...prev, {
      id: Date.now(),
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
    }]);
    setClicked(moodId);
    // After expansion animation, confirm
    setTimeout(() => onSelect(moodId), 550);
  }

  // Clean old ripples
  useEffect(() => {
    if (!ripples.length) return;
    const t = setTimeout(() => setRipples(prev => prev.slice(1)), 500);
    return () => clearTimeout(t);
  }, [ripples]);

  if (selected) {
    const mood = MOODS.find(m => m.id === selected);
    return (
      <div style={{
        position:'absolute', bottom:16, left:0, right:0,
        padding:'0 24px', zIndex:10, textAlign:'center',
      }}>
        <div style={{
          display:'inline-block',
          animation:'popSpring 0.5s var(--spring) both',
        }}>
          <p style={{ fontSize:36, marginBottom:2 }}>{mood?.emoji}</p>
          <p style={{ fontSize:13, color:'rgba(255,255,255,0.85)', fontWeight:500 }}>
            {mood?.label}
          </p>
          <p style={{ fontSize:11, color:'rgba(255,255,255,0.55)', marginTop:4 }}>
            已为今天点亮天空
          </p>
        </div>
      </div>
    );
  }

  return (
    <div style={{
      position:'absolute', bottom:12, left:0, right:0,
      padding:'0 20px', zIndex:10,
    }}>
      <p style={{
        textAlign:'center', fontSize:13, color:'rgba(255,255,255,0.5)',
        marginBottom:10, letterSpacing:'0.06em',
      }}>
        今天的天气是...
      </p>
      <div style={{ display:'flex', gap:8, justifyContent:'center' }}>
        {MOODS.map((m, i) => {
          const isHovered = hovered === m.id;
          const isClicked = clicked === m.id;
          return (
            <button
              key={m.id}
              onClick={(e) => handleClick(m.id, e)}
              onMouseEnter={() => setHovered(m.id)}
              onMouseLeave={() => setHovered(null)}
              disabled={!!clicked}
              style={{
                flex:1, maxWidth:78, position:'relative', overflow:'hidden',
                display:'flex', flexDirection:'column', alignItems:'center', gap:4,
                padding:'13px 6px', borderRadius:22,
                border:'1.5px solid rgba(255,255,255,0.25)',
                background: isClicked
                  ? 'rgba(255,255,255,0.22)'
                  : isHovered
                    ? 'rgba(255,255,255,0.16)'
                    : 'rgba(255,255,255,0.08)',
                backdropFilter:'blur(6px)',
                color:'#fff',
                cursor: clicked ? 'default' : 'pointer',
                transition: `all 0.2s var(--spring-soft)`,
                transform: isHovered && !clicked
                  ? 'translateY(-3px) scale(1.04)'
                  : isClicked
                    ? 'scale(0.92)'
                    : 'scale(1)',
                opacity: clicked && !isClicked ? 0.4 : 1,
                animation: isClicked
                  ? `popSpring 0.55s var(--spring) both`
                  : `floatUp 0.4s var(--ease-out) both`,
                animationDelay: `${i * 60}ms`,
              }}
            >
              {/* Ripple */}
              {ripples.filter(r => {
                // show only ripples on this button during click animation
                return true;
              }).map(r => (
                <Ripple key={r.id} x={r.x} y={r.y} color="rgba(255,255,255,0.4)" />
              ))}
              <span style={{
                fontSize:26,
                transition:'transform 0.25s var(--spring)',
                transform: isHovered && !clicked ? 'scale(1.18)' : 'scale(1)',
              }}>
                {m.emoji}
              </span>
              <span style={{
                fontSize:11, opacity:0.8,
                transition:'opacity 0.2s',
              }}>
                {m.label}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   ClassPulse
   ══════════════════════════════════════════ */
function ClassPulse({ todayCount, dominantMood }) {
  return (
    <div style={{
      textAlign:'center', padding:'4px 0 2px',
      color:'var(--warm-400)', fontSize:12,
      animation:'fadeIn 0.5s var(--ease-out) both',
      animationDelay:'0.3s',
    }}>
      今天 {todayCount} 人已表达情绪
      {dominantMood && (
        <span style={{ color:'var(--mint-500)', marginLeft:6 }}>
          · 班级基调：{dominantMood}
        </span>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   Particle System — float in, fade out
   ══════════════════════════════════════════ */
function ParticleBubble({ particle, index, removing }) {
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      padding:'5px 13px', borderRadius:20,
      background:'rgba(255,255,255,0.5)',
      border:'1px solid var(--warm-100)',
      fontSize:12, color:'var(--warm-500)',
      whiteSpace:'nowrap',
      animation: removing
        ? 'particleFade 0.5s var(--ease-in) forwards'
        : `particleFloat 0.4s var(--spring-soft) both`,
      animationDelay: removing ? '0s' : `${index * 50}ms`,
      cursor:'default',
      transition:'transform 0.2s var(--spring-soft)',
    }}
      onMouseEnter={e => { if(!removing) e.currentTarget.style.transform='translateY(-2px)'; }}
      onMouseLeave={e => { if(!removing) e.currentTarget.style.transform=''; }}
    >
      {particle.emoji} {particle.label}
    </span>
  );
}

function ParticlePicker({ onAdd }) {
  const [open, setOpen] = useState(false);
  const OPTIONS = [
    { id:'passing', emoji:'🚶', label:'刚刚路过这儿' },

    { id:'late', emoji:'🌙', label:'深夜还没睡' },

    onAdd(opt);

        onMouseEnter={e => { e.currentTarget.style.borderColor='var(--coral-300)'; e.currentTarget.style.color='var(--coral-400)'; }}

/* ══════════════════════════════════════════
   HelpForm — ritual confirm, not 1.5s toast
   ══════════════════════════════════════════ */
function HelpForm() {
  const [text, setText] = useState('');
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);

  async function submit() {
    if (!text.trim()) return;
    setSending(true);
    // Simulate API
    await new Promise(r => setTimeout(r, 600));
    setSending(false);
    setSent(true);
  }

  function reset() {
    setSent(false);
    setText('');
  }

  if (sent) {
    return (
      <div style={{
        padding:'18px 16px', borderRadius:18,
        background:'var(--coral-50)', border:'1px solid var(--coral-100)',
        textAlign:'center',
        animation:'popSpring 0.5s var(--spring) both',
      }}>
        <p style={{ fontSize:32, marginBottom:6, display:'inline-block',
          animation:'starGlow 2s var(--ease-in-out) infinite' }}>
          ✨
        </p>
        <p style={{ fontSize:14, color:'var(--coral-500)', fontWeight:500 }}>
          已发出
        </p>
        <p style={{ fontSize:12, color:'var(--warm-400)', marginTop:4 }}>
          辅导员会在今天内看到
        </p>
        <div style={{ display:'flex', gap:10, justifyContent:'center', marginTop:12 }}>
          <button onClick={reset} style={{
            padding:'6px 18px', borderRadius:16,
            border:'1px solid var(--coral-200)', background:'transparent',
            color:'var(--coral-400)', fontSize:12, cursor:'pointer',
          }}>
            换个方式说
          </button>
          <button onClick={reset} style={{
            padding:'6px 18px', borderRadius:16,
            border:'none', background:'var(--coral-100)',
            color:'var(--coral-500)', fontSize:12, cursor:'pointer',
          }}>
            先收回去
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ animation:'floatUp 0.3s var(--ease-out) both' }}>
      <textarea
        value={text}
        onChange={e => setText(e.target.value)}
        placeholder="一句话求助：谁会做PPT？/ 今天有点想哭..."
        maxLength={200}
        style={{
          width:'100%', height:60, padding:10, borderRadius:14,
          border:'1px solid var(--coral-200)',
          background:'rgba(255,255,255,0.6)',
          fontSize:13, color:'var(--warm-700)',
          resize:'none', outline:'none', fontFamily:'inherit',
          transition:'border-color 0.2s, box-shadow 0.2s',
        }}
        onFocus={e => {
          e.currentTarget.style.borderColor='var(--coral-400)';
          e.currentTarget.style.boxShadow='0 0 0 3px rgba(255,122,107,0.1)';
        }}
        onBlur={e => {
          e.currentTarget.style.borderColor='var(--coral-200)';
          e.currentTarget.style.boxShadow='none';
        }}
      />
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:8 }}>
        <span style={{ fontSize:11, color:'var(--warm-300)' }}>{text.length}/200</span>
        <button onClick={submit} disabled={sending || !text.trim()} style={{
          padding:'7px 20px', borderRadius:16,
          border:'none', background:'var(--coral-400)', color:'#fff',
          fontSize:13, fontWeight:500, cursor:'pointer',
          opacity: (sending || !text.trim()) ? 0.4 : 1,
          transition:'all 0.2s var(--ease-out)',
          transform: sending ? 'scale(0.96)' : 'scale(1)',
        }}>
          {sending ? '发送中...' : '发出求助'}
        </button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   ShareQuick — dashed circle entry
   ══════════════════════════════════════════ */
function ShareQuick() {
  const [open, setOpen] = useState(false);
  const [text, setText] = useState('');
  const [sent, setSent] = useState(false);

  async function submit() {
    if (!text.trim()) return;
    await new Promise(r => setTimeout(r, 400));
    setSent(true);
    setTimeout(() => { setSent(false); setOpen(false); setText(''); }, 2500);
  }

  if (!open) {
    return (
      <button onClick={() => setOpen(true)} style={{
        width:'100%', padding:'14px',
        borderRadius:18, border:'1.5px dashed var(--mint-300)',
        background:'var(--mint-50)',
        color:'var(--mint-500)', fontSize:13, cursor:'pointer',
        transition:'all 0.25s var(--ease-out)',
      }}
        onMouseEnter={e => { e.currentTarget.style.borderColor='var(--mint-400)'; e.currentTarget.style.background='var(--mint-100)'; }}
        onMouseLeave={e => { e.currentTarget.style.borderColor='var(--mint-300)'; e.currentTarget.style.background='var(--mint-50)'; }}
      >
        ✨ 说点什么吧
      </button>
    );
  }

  if (sent) {
    return (
      <div style={{
        textAlign:'center', padding:14, borderRadius:16,
        background:'var(--mint-50)', border:'1px solid var(--mint-200)',
        animation:'popSpring 0.45s var(--spring) both',
      }}>
        <span style={{ fontSize:16, display:'inline-block',
          animation:'starGlow 2s var(--ease-in-out) infinite' }}>
          ✨
        </span>
        <span style={{ fontSize:13, color:'var(--mint-500)', marginLeft:6 }}>已分享给班级</span>
      </div>
    );
  }

  return (
    <div style={{ animation:'floatUp 0.3s var(--ease-out) both' }}>
      <textarea value={text} onChange={e => setText(e.target.value)}
        placeholder="分享一件小事..."
        autoFocus maxLength={200}
        style={{
          width:'100%', height:52, padding:10, borderRadius:14,
          border:'1px solid var(--mint-200)', background:'var(--mint-50)',
          fontSize:13, color:'var(--warm-700)', resize:'none', outline:'none',
          fontFamily:'inherit',
        }}
      />
      <div style={{ display:'flex', justifyContent:'flex-end', gap:8, marginTop:8 }}>
        <button onClick={() => setOpen(false)} style={{
          padding:'5px 16px', borderRadius:20, border:'none',
          background:'var(--warm-100)', color:'var(--warm-500)', fontSize:12, cursor:'pointer',
        }}>算了</button>
        <button onClick={submit} disabled={!text.trim()} style={{
          padding:'5px 18px', borderRadius:20, border:'none',
          background:'var(--mint-400)', color:'#fff', fontSize:12, fontWeight:500, cursor:'pointer',
          opacity: text.trim() ? 1 : 0.4,
          transition:'all 0.15s var(--ease-out)',
        }}>分享</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   Confetti Fragment — for ritual moments
   ══════════════════════════════════════════ */
function Confetti({ count = 8 }) {
  const fragments = useMemo(() =>
    Array.from({length:count}, (_,i) => ({
      id:i, x:Math.random()*100, delay:Math.random()*0.3,
      color:['#FF7A6B','#4ECDC4','#FFB355','#FFA99E','#B5F0DB'][i%5],
      size:Math.random()*6+4,
    })), [count]);

  return (
    <div style={{ position:'absolute', inset:0, pointerEvents:'none', overflow:'hidden' }}>
      {fragments.map(f => (
        <span key={f.id} style={{
          position:'absolute', left:`${f.x}%`, top:'-20px',
          width:f.size, height:f.size,
          borderRadius:2, background:f.color,
          animation:`confettiDrop 1.5s var(--ease-in) forwards`,
          animationDelay:`${f.delay}s`,
        }} />
      ))}
    </div>
  );
}

/* ══════════════════════════════════════════
   MAIN APP
   ══════════════════════════════════════════ */
function App() {
  const [mood, setMood] = useState(null);
  const [showCounselorMood, setShowCounselorMood] = useState(true);
  const [particles, setParticles] = useState([
    { id:1, emoji:'🚶', label:'刚刚路过这儿' },
    { id:2, emoji:'📚', label:'在图书馆摸鱼' },
    { id:3, emoji:'🍃', label:'今天有点闲' },
    { id:4, emoji:'🎒', label:'刚下课放空' },
  ]);
  const [confirm, setConfirm] = useState(null); // {message, onConfirm}
  const nextParticleId = useRef(5);

  // ── Simulated data ──
  const todayCount = mood ? (22) : (9);
  const dominantMood = mood==='STORMY'?'风暴':mood==='RAINY'?'阴雨':mood==='GROWING'?'生长':mood==='SUNNY'?'晴朗':null;

  const shares = [
    { id:1, content:'今天在图书馆看到一只胖橘猫 🐱', user:{name:'匿名'} },
    { id:2, content:'推荐这首歌：坂本龙一《Merry Christmas Mr. Lawrence》', user:{name:'音乐社小林'} },
  ];

  const helpPosts = [
    { id:1, content:'谁会做概率论作业？求带 🙏', anonymous:false, _count:{replies:3} },
    { id:2, content:'最近压力好大，有没有人能聊聊天', anonymous:true, _count:{replies:1} },
  ];

  const topics = [
    { id:1, title:'这学期你最想完成的一件事是什么？', tags:'新学期,目标', isNotice:false, isMicroAction:false },
    { id:2, title:'今晚操场散步 20 分钟', tags:'微行动', isNotice:false, isMicroAction:true },
  ];

  const goodDeeds = [
    { id:1, content:'多了一把伞，谁要？在图书馆门口', user:{name:'雨天的陌生人'} },
  ];

  function addParticle(opt) {
    const newP = { id:nextParticleId.current++, emoji:opt.emoji, label:opt.label };
    setParticles(prev => [newP, ...prev]);
  }

  function tryDeleteTopic() {
    setConfirm({
      message:'确定删除这个话题吗？删除后同学们的讨论也会消失。',
      onConfirm: () => setConfirm(null),
    });
  }

  const skyHeight = '36vh';

  return (
    <div style={{ minHeight:'100vh', background:'var(--cream)' }}>
      {/* ── SKY ── */}
      <div style={{ position:'relative', height:skyHeight, overflow:'hidden' }}>
        <AtmosphereBlobs mood={mood} />
        <StarrySky mood={mood} starCount={65} />
        {showCounselorMood && (
          <CounselorMoodBanner onDismiss={() => setShowCounselorMood(false)} />
        )}
        <MoodPicker onSelect={setMood} selected={mood} />
      </div>

      {/* ── PULSE ── */}
      {mood && <ClassPulse todayCount={todayCount} dominantMood={dominantMood} />}

      {/* ── CONTENT ── */}
      <div style={{ padding:'18px 16px', display:'flex', flexDirection:'column', gap:22 }}>

        {/* Particles */}
        <section>
          <SectionHeader label="此刻" />
          <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
            {particles.map((p, i) => (
              <ParticleBubble key={p.id} particle={p} index={i} />
            ))}
          </div>
          <div style={{ marginTop:8 }}>
            <ParticlePicker onAdd={addParticle} />
          </div>
        </section>

        {/* Share */}
        <section>
          <SectionHeader label="日常" />
          <ShareQuick />
          {shares.length > 0 && (
            <div style={{ marginTop:8, display:'flex', flexDirection:'column', gap:6 }}>
              {shares.map((s, i) => (
                <div key={s.id} style={{
                  padding:'10px 14px', borderRadius:14,
                  background:'rgba(255,255,255,0.5)', border:'1px solid var(--warm-100)',
                  fontSize:13, color:'var(--warm-600)',
                  animation:`floatUp 0.3s var(--ease-out) both`,
                  animationDelay:`${i*60}ms`,
                }}>
                  {s.content}
                  <span style={{ fontSize:10, color:'var(--warm-400)', marginLeft:8 }}>{s.user.name}</span>
                </div>
              ))}
            </div>
          )}
        </section>

        {/* Help */}
        <section>
          <SectionHeader label="互助" />
          <HelpForm />
          <div style={{ display:'flex', flexDirection:'column', gap:8, marginTop:10 }}>
            {helpPosts.map((p, i) => <HelpCard key={p.id} post={p} index={i} />)}
          </div>
        </section>

        {/* Topics */}
        <section>
          <SectionHeader label="话题" />
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {topics.map((t, i) => <TopicCard key={t.id} topic={t} index={i} />)}
          </div>
        </section>

        {/* Good deeds */}
        <section>
          <SectionHeader label="多余的好意" />
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {goodDeeds.map((d, i) => <GoodDeedCard key={d.id} deed={d} index={i} />)}
          </div>
        </section>

        <div style={{ height:8 }} />
      </div>

      {/* Bottom Nav */}
      <div style={{ position:'sticky', bottom:0 }}>
        <BottomNav active="class" />
      </div>

      {/* Confirm Panel */}
      {confirm && (
        <ConfirmPanel
          message={confirm.message}
          onConfirm={confirm.onConfirm}
          onCancel={() => setConfirm(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
